[package]
name = "linkcam-vcam"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
linkcam-core = { path = "../linkcam-core" }
linkcam-win = { path = "../linkcam-win" }
windows-core = "0.62"

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
]
